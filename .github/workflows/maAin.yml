name: SFad

on:
  workflow_dispatch:

jobs:
  secure-FFSFBk:
    runs-on: windows-latest
    timeout-minutes: 260

    steps:
      - name: TDFSFD22
        run: |
          # hi hi hi hi hi hi hi
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # go go go go go go go go go go
          netsh advfirewall firewall delete rule name="SDFVVD-Tailscale"
          
          # fofo fo fo foffo  port 3389
          netsh advfirewall firewall add rule name="SDFVVD-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # do do do do do do do do 
          Restart-Service -Name TermService -Force

      - name: Test 65
        run: |
          # sosososo so so os os os
          $password = "Zxxz4444"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # aoao ao oao  ooa aoo oa oa oa oa o
          $existing = Get-LocalUser -Name "SDFVVD" -ErrorAction SilentlyContinue
          if ($existing) {
              Set-LocalUser -Name "SDFVVD" -Password $securePass
              Write-Host "Existing user 'SDFVVD' found. Password updated."
          } else {
              New-LocalUser -Name "SDFVVD" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "SDFVVD"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "SDFVVD"
              Write-Host "User 'SDFVVD' created and added to Administrators and Remote Desktop Users."
          }

          # as sa sas a  sa as sa a sa sa  sa
          echo "SDFVVD_CREDS=User: SDFVVD | Password: $password" >> $env:GITHUB_ENV

          # fr fr fr rf rf r  f ffr fr
          if (-not (Get-LocalUser -Name "SDFVVD")) {
              Write-Error "User creation/check failed"
              exit 1
          }

      - name: ADSSTT 62
        run: |
          $tsUrl = "https://tinyurl.com/dwonloadd4122"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: SVST 562
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.ADXSA124187_AUTH_KEY}} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: DSDSF 51 Verify
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # dsadssadsa sad sd sda sad  sa aas  asd sda dsa   
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to SDFVVD port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: TSDFst 54
        run: |
          Write-Host "`n=== SDFVVD ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: SDFVVD"
          Write-Host "Password: $(echo $env:SDFVVD_CREDS)"
          Write-Host "==================`n"
          
          # sad   d asd sa s sa a sd sad ds asd sad      d sd 
          while ($true) {
              Write-Host "[$(Get-Date)] SDFVVD Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 5000
          }



